name: Publish validated macOS release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git merge-base --is-ancestor validation-cutover-2026-08-24 "${GITHUB_SHA}"
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > validation-manifest.json
          test -s validation-manifest.json
          python3 -c 'import json, os; m = json.load(open("validation-manifest.json")); assert m["candidate"]["sha"] == os.environ["GITHUB_SHA"]; assert "v" + m["version"] == os.environ["GITHUB_REF_NAME"]'
      - run: brew install just
      - run: python3 scripts/check_config.py
      - run: just build release dist/prophet-macos-arm64 1
      - run: |
          python3 scripts/package_release.py --manifest validation-manifest.json --output-dir dist --candidate-sha "${GITHUB_SHA}"
      - run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
